<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Light mode Gilgamesh Logo -->
  <rect width="512" height="512" rx="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Pen/Quill shape -->
  <g transform="translate(256, 256)">
    <!-- Quill feather -->
    <path d="M-80 -40 Q-100 -60 -110 -40 Q-120 -20 -100 0 L-40 80 Q-20 100 0 110 L40 80 Q20 100 0 110 L-40 80 Q-60 60 -80 -40" fill="#1a1f2e" opacity="0.95"/>
    
    <!-- Ink detail -->
    <ellipse cx="-60" cy="-20" rx="15" ry="25" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Text: Gilgamesh -->
    <text x="80" y="40" font-size="80" font-weight="700" font-family="system-ui, -apple-system" fill="#1a1f2e" letter-spacing="-2">
      Gilgamesh
    </text>
  </g>
</svg>